name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python — pytest + ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: ruff
        run: ruff check api tests scripts
      - name: pytest
        # The suite is fully offline, so a Yahoo outage can never redden CI.
        run: pytest
      - name: field manual is in sync with the explanation layer
        # docs/field-manual.html documents every metric in _lib/explain.py, with
        # the definitions injected from the registry rather than transcribed.
        # This fails when a metric is added without regenerating it, which is the
        # only way the manual can silently go stale.
        run: python scripts/build_glossary.py --check

  web:
    name: Web — types + lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: typecheck
        run: npx tsc --noEmit
      - name: lint
        run: npm run lint
      - name: frontend logic
        # The Python suite cannot reach the pure functions that only run in a
        # browser — `agreementOf` decides the confluence rail's headline claim
        # and shipped untested. Compiles them with the tsc already in the tree
        # and asserts on bare node; no test framework, no new dependency.
        run: npm run check:frontend
      - name: build
        run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Production dependencies must stay clean. This is the check that would
      # have caught the Next.js advisory backlog months earlier.
      - run: npm audit --omit=dev --audit-level=high
